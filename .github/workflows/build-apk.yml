name: Build Flutter Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
env:
  FLUTTER_VERSION: '3.29.3'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Android platform with existing application ID
        run: flutter create --platforms=android --org com.aistudio.alhadithi --project-name iqshia .
      - name: Set Android app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="iqshia"', 'android:label="خَزَائِنُ الهُدَى"')
          p.write_text(s)
          PY
      - name: Pin Android NDK version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('android {', 'android {\n    ndkVersion = "27.0.12077973"', 1)
          s = s.replace(
              '    ndkVersion = "27.0.12077973"',
              '    ndkVersion = "27.0.12077973"\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }',
              1,
          )
          s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: khazain-al-huda-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
