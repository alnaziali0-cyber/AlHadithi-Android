name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify the Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache the Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ~/.gradle
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: android-sdk-${{ runner.os }}-

      - name: Install the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --licenses <<< $'\n' || true

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Compile the Kotlin sources
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Run the unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble the release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khazain-al-huda-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: khazain-al-huda-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
