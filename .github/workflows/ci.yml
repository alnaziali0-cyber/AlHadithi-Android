name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Audit project assets and manifests
        run: python scripts/audit_project.py
      - name: Compile Python and check admin JavaScript
        run: |
          python -m compileall -q services/api content/resources/quran
          node --check apps/admin/admin.js
      - name: Run API tests
        run: pytest -q
      - name: Apply and compare Alembic migrations
        working-directory: services/api
        env:
          DATABASE_URL: sqlite:////tmp/khazain-ci-migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic check

  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze Flutter sources
        working-directory: apps/mobile
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test
