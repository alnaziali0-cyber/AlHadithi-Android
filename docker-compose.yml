services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: khazain
      POSTGRES_USER: khazain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khazain -d khazain"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://khazain:${POSTGRES_PASSWORD}@db:5432/khazain
      MEDIA_ROOT: /data/media
      COOKIE_SECURE: "true"
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks: [private, edge]

  publisher:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://khazain:${POSTGRES_PASSWORD}@db:5432/khazain
      MEDIA_ROOT: /data/media
      COOKIE_SECURE: "true"
    command: ["python", "scripts/publication_worker.py"]
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [edge]

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:

networks:
  private:
    internal: true
  edge:
